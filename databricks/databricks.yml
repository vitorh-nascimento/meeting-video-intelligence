# ==============================================================================
# Databricks Asset Bundle (DAB) — Meeting & Video Intelligence Lakehouse POC
# Arquitetura Medalhão Serverless com Lakeflow SDP SQL:
# - Bronze: ingestão incremental com read_files()
# - Silver: limpeza + parsing de falantes e metadados
# - Gold: extração estruturada via ai_query() + responseFormat (JSON Schema)
# ==============================================================================

bundle:
  name: meeting_video_intelligence

variables:
  catalog:
    description: "Unity Catalog onde o schema, volume e tabelas Medallion residem"
    default: "workspace"
  schema:
    description: "Schema alvo no Unity Catalog"
    default: "meeting_intelligence_poc"
  volume_name:
    description: "Nome do Volume no Unity Catalog que recebe as transcrições (.srt, .vtt, .txt, .json)"
    default: "raw_transcripts"
  ai_query_endpoint:
    description: "Endpoint de Foundation Model usado por ai_query() com responseFormat na camada Gold"
    default: "databricks-meta-llama-3-3-70b-instruct"

resources:
  schemas:
    meeting_intelligence_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: "Schema analítico da POC Meeting & Video Intelligence (Bronze read_files -> Silver falantes/metadados -> Gold ai_query responseFormat)"

  volumes:
    raw_transcripts_volume:
      name: ${var.volume_name}
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.meeting_intelligence_schema.name}
      volume_type: MANAGED
      comment: "Landing zone de transcrições de reuniões e vídeos (.srt, .vtt, .txt, .json)"

  pipelines:
    meeting_intelligence_pipeline:
      name: "[${bundle.target}] Meeting & Video Intelligence — Medallion AI Pipeline"
      catalog: ${var.catalog}
      schema: ${resources.schemas.meeting_intelligence_schema.name}
      serverless: true
      continuous: false
      channel: current
      root_path: ./src/pipelines/meeting_intelligence
      libraries:
        - glob:
            include: ./src/pipelines/meeting_intelligence/transformations/**
      configuration:
        raw_volume_path: "/Volumes/${var.catalog}/${resources.schemas.meeting_intelligence_schema.name}/${resources.volumes.raw_transcripts_volume.name}"
        ai_query_endpoint: "${var.ai_query_endpoint}"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: meeting_intelligence_poc

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: meeting_intelligence

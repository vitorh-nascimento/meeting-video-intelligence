bundle:
  name: meeting-intel-portal

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
  files_id:
    description: Three-level UC Volume full name (catalog.schema.volume)
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
    default: meeting-intelligence-poc

resources:
  apps:
    app:
      name: "meeting-intel-portal"
      description: "Portal corporativo Meeting & Video Intelligence com Tutorial, Tabelas Gold, Upload UC Volume e Genie Space"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - files.files

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  # O host do workspace NAO fica versionado: vem do perfil do CLI (--profile)
  # ou da variavel de ambiente DATABRICKS_HOST.
  # Os valores das variaveis acima vem de BUNDLE_VAR_<nome> ou de
  # .databricks/bundle/default/variable-overrides.json (ignorado pelo git).
  # Veja a secao "Configuracao do deploy" no README.
  default:
    default: true

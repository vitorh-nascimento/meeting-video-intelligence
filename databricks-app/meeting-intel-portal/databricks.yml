bundle:
  name: meeting-intel-portal

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
  files_id:
    description: Three-level UC Volume full name (catalog.schema.volume)
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "meeting-intel-portal"
      description: "Portal corporativo Meeting & Video Intelligence com Tutorial, Tabelas Gold, Upload UC Volume e Genie Space"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - files.files

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-2339f0a9-6973.cloud.databricks.com

    variables:
      sql_warehouse_id: bf5166fb4194bfb5
      files_path: /Volumes/workspace/dev_vitortesteestudos_meeting_intelligence_poc/raw_transcripts
      files_id: workspace.dev_vitortesteestudos_meeting_intelligence_poc.raw_transcripts
      genie_space_id: 01f1e74322c219b19b70b741bbfb0b84
      genie_space_name: meeting-intelligence-poc
